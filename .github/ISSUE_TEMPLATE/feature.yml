name: Feature idea
description: Something you'd like the app to do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What would you like?
      description: Describe it from your point of view ("When I log dinner I want to…").
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
